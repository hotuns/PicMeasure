[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "picmeasure"
version = "0.3.0"
description = "Measure tree branch lengths from photos via an orange-red reference ball and click-based polylines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless>=4.8.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "typer[all]>=0.9.0",
    "pydantic-settings>=2.0.0",
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "python-multipart>=0.0.20",
    "pymysql>=1.1.1",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.5.0",
    "opencv-stubs>=0.0.1",
    "ruff>=0.1.0",
    "pyinstaller>=6.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
picmeasure = "picmeasure.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picmeasure = ["web_static/**"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
implicit_reexport = false
ignore_missing_imports = true
exclude = ["site-packages", "miniconda3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=picmeasure --cov-report=term-missing"
markers = [
    "unit: unit tests (fast, no I/O beyond tmp_path)",
    "integration: integration tests (full picker / CLI smoke)",
]
